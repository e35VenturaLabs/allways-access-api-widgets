name: Release (publish a widget to npm)

# Manual only: Actions → "Release (publish a widget to npm)" → Run workflow, from main.
# Stages the widget on npm with trusted publishing (OIDC, no stored token). Nothing goes live until
# a maintainer approves the staged version on npmjs.com with their passkey. See the root README.
on:
  workflow_dispatch:
    inputs:
      widget:
        description: "Widget to release"
        type: choice
        options:
          - tip-jar
      bump:
        description: "Version bump (semver): patch = fixes, minor = new features, major = breaking changes"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Dry run: test, build and pack, but stage, commit and tag nothing"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  APPROVAL_WAIT_MINUTES: 30

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WIDGET: ${{ inputs.widget }}
      # Job-level so the Discord steps' `if` can see it; a step's own env isn't visible to its `if`.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Use the latest npm (staged publishing needs 11.15 or newer)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: |
          npm run typecheck -w "$WIDGET"
          npm run test -w "$WIDGET"
          npm run build -w "$WIDGET"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          NAME=$(node -p "require('./$WIDGET/package.json').name")
          if ! npm view "$NAME" name >/dev/null 2>&1; then
            echo "::error::$NAME isn't on npm yet. Trusted publishing only works for an existing package: publish the first version by hand (see the root README), then rerun."
            exit 1
          fi
          npm version "$BUMP" -w "$WIDGET" --no-git-tag-version
          VERSION=$(node -p "require('./$WIDGET/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Pick a bigger bump."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$WIDGET-v$VERSION" >> "$GITHUB_OUTPUT"

      # Staging reserves the version number (a staged version can't be staged or published
      # twice), so the commit and tag below are safe before approval.
      - name: Stage on npm
        env:
          # Optional fallback. Leave the secret unset to use trusted publishing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance only works from a public repository.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "Staging with the NPM_TOKEN secret."
          else
            echo "Staging with npm trusted publishing (OIDC)."
          fi
          args=(-w "$WIDGET" --access public)
          if [ "$PROVENANCE" = "true" ]; then args+=(--provenance); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm stage publish "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/stage.log"

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $NAME@$VERSION"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Draft GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --draft --title "$NAME $VERSION" --generate-notes

      - name: Notify Discord (staged)
        if: ${{ !inputs.dry_run && env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          payload=$(jq -n --arg content "⏳ **$NAME@$VERSION** is staged on npm and waiting for a maintainer to approve it — https://www.npmjs.com/package/$NAME" '{content: $content}')
          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK"

      # npm only moves the latest dist-tag once a staged version is approved and live.
      - name: Wait for approval on npm
        id: approval
        if: ${{ !inputs.dry_run }}
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Approve it now: npmjs.com → $NAME → Staged packages, or run 'npm stage list $NAME' then 'npm stage approve <stage-id>'."
          deadline=$(( $(date +%s) + APPROVAL_WAIT_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$(npm view "$NAME" dist-tags.latest --prefer-online 2>/dev/null)" = "$VERSION" ]; then
              echo "approved=true" >> "$GITHUB_OUTPUT"
              echo "$NAME@$VERSION is live."
              exit 0
            fi
            sleep 30
          done
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "::warning::$NAME@$VERSION wasn't approved within $APPROVAL_WAIT_MINUTES minutes. It stays staged; see the summary to finish the release."

      - name: Publish GitHub release
        if: ${{ steps.approval.outputs.approved == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Notify Discord (live)
        if: ${{ steps.approval.outputs.approved == 'true' && env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          payload=$(jq -n --arg content "📦 **$NAME@$VERSION** is live on npm — https://www.npmjs.com/package/$NAME" '{content: $content}')
          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK"

      - name: Summary
        if: always()
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          {
            if [ -z "$VERSION" ]; then
              echo "Stopped before a version was chosen. See the failed step."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: would stage **$NAME@$VERSION**. Nothing was staged, committed or tagged."
            elif [ "$APPROVED" = "true" ]; then
              echo "**$NAME@$VERSION** is live on npm — https://www.npmjs.com/package/$NAME"
              echo
              echo "Tagged \`$TAG\` and published the GitHub release."
            else
              echo "**$NAME@$VERSION** is staged on npm and waiting for approval. Tagged \`$TAG\`; the GitHub release is a draft."
              echo
              echo "To finish:"
              echo "1. Approve it: npmjs.com → $NAME → **Staged packages** → Approve (passkey), or \`npm stage list $NAME\` then \`npm stage approve <stage-id>\`."
              echo "2. Publish the draft: \`gh release edit $TAG --draft=false --latest\`, or **Publish release** on the draft in GitHub."
              echo
              echo "To cancel instead: \`npm stage reject <stage-id>\`, then delete the draft release. The next run uses the next version number."
            fi
            if [ -f "$RUNNER_TEMP/stage.log" ]; then
              echo
              echo "<details><summary>npm stage output</summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/stage.log"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
